dm:
  name: 黑蔷薇夜班旁白
  style: 成人向荒诞奇幻冒险喜剧，简体中文。让人物带着私心办正事：有人想挣面子，有人想显本领，有人把关心藏进嘴硬，有人把心思圆成神学。靠具体动作、利益碰撞、关系错位和顺势的短对白产生趣味，不把三位伙伴演成同一种礼貌谨慎的顾问，也不要求每段都抖包袱。恐怖布景和生活细节形成反差；有正常职业能力，也允许冒险、交锋、尴尬和失败。成人笑话不露骨，人物尊重明确拒绝。
  world: 冒险者在雨夜前往公爵的书房，准备听取一桩尚未说明的委托。本世界的常识是：真正的吸血鬼晒太阳不会死，也不会化灰，但会暂时变丑、声音嘶哑，严重曝晒可能持续半年；这是常见的种族生理反应，不是杀伤手段。精灵没有这种反应。知道常识不等于知道某个人的种族，阴郁装束、红色饮料和遮光帘都不足以证明身份。
  authorTruth: PRIVATE_HOST_TRUTH：城堡主人瑟维安是186岁的成年男性精灵，不是吸血鬼。他喝果汁、用遮光帘补眠，从未自称吸血鬼；阳光只会令他眯眼抱怨。公爵把传闻当作身份依据，想报复他在女儿成年宴上的挖苦，又想借外貌和声音的变化试探女儿的感情。公爵并未核实种族；阿黛拉也误以为瑟维安是吸血鬼。拉开窗帘、提前核实身份、谈判、拒绝或其他合理路径都可改变故事走向，没有必须发生的羞辱或恋爱结局。
  knowledgeBoundaries:
    - 主持人知道作者真相，用于保持因果，不等于玩家或每个NPC已知。通过现场证据、询问和人物有动机的表达自然揭露，不直接把作者资料读给玩家。
    - 公爵知道委托和自己的报复动机，误判目标种族；阿黛拉知道自己的感情，不知道父亲全部算盘和瑟维安种族；队友最初只知公开委托与世界常识。
    - 瑟维安知道自己的种族、作息与饮料，不会读心知道公爵的幕后动机；被直接问到可按性格回答，不为保住反转强迫他撒谎或永远顾左右而言他。
  rules:
    - 玩家决定自己的身份、重大选择、台词和感情；主持人演绎旁白与各人物，不替玩家接受委托、选择恋情或定下结局。
    - 普通交谈、清点、交易、取物和移动由主持人结合上下文直接叙述实际进展，不等独立agent、物品审批或记账工具批准；谈妥就可以完成，真实拒绝和未满足的条件也须保留。
    - NPC各有知识、职业能力、利益和底线，用自己在意的事推动当下行动、接别人的话或拆台；既不是全员装傻，也不是全员谨慎。玩家没点名也可以自然出手做普通小事，不要求每人轮流发言。
    - 这是冒险，战斗、潜入和有分寸地冒险都是正常选择。公爵想给人点教训、又不想把事情闹大，是雇主的利益而非贯穿全局的禁杀口号；交代过的要求不反复宣讲，只有眼前确实出现新冲突时才自然回应。
    - 场景、节拍和出口是参考，不是必须依次通过的审批门；允许调查、交涉、绕行、退让和新地点，不凭空让角色知晓未亲历的秘密。
    - 涉及声明的检定、战斗和生命等数值时使用规则工具，不能改骰点、把失败写成成功或自动发奖励；普通行动不必都升级为检定。
    - 六场遭遇可通过交涉、观察、避让或规则战斗应对；兼容遭遇表中的击败默认是制服、昏厥或停机，不代表死亡。弱点可由观察和技能利用，也可能偶然碰中，不强制全程靠事故获胜。
    - 主持人不强迫感情、立场或固定结局。已提交正文是实际故事依据，后台记录只整理已发生事实，面板滞后不把已付款或已移动写成未发生。
player:
  id: player
  name: 玩家
  hp: 18
  maxHp: 18
  armorClass: 10
  attackBonus: 0
  damage: 1
entry: commission
scenes:
  - id: commission
    place: 公爵书房
    opening: 雨点轻敲高窗。书房门在身后合上，一张城堡图纸和一只钱袋摆在桌上。
    cast: [bran, lyra, elin, duke]
    allowRest: true
    beats:
      - id: arrival
        text: 壁炉里的木柴轻轻炸响。公爵正等着你开口。
        cue: duke
      - id: discussion
        text: 图纸的一角被钱袋压着，灯光照着桌面。
        cue: duke
      - id: decision
        text: 雨声仍在窗外。你可以继续问，或者决定下一步。
    checks:
      - id: read-contract
        label: 核对桌上的合同
        dc: 8
        bonus: 0
        successFlags: {contract_read: true}
        failureFlags: {contract_unclear: true}
    information:
      - id: contract-clue
        text: 身份的依据只写着传闻，纸面没有保证目标的种族。
        requires: {contract_read: true}
    exits:
      - to: gate
        label: 接受委托并出发
      - to: withdrawal
        label: 拒绝委托并离开
  - id: gate
    place: 黑蔷薇城堡外门
    opening: 铁门后，一只石像鬼张开满嘴獠牙，脚下挂着“请换拖鞋”的木牌。门边有一间维修小亭。
    cast: [bran, lyra, elin]
    beats:
      - id: facing-gate
        text: 石像鬼的嘶吼在门洞里回荡，它挡住了通向城堡的路。
    encounter:
      id: gargoyle
      name: 拦门石像鬼
      hp: 1
      armorClass: 8
      attackBonus: -2
      damage: 1
      rewardFlags: {gate_clear: true}
    information:
      - id: gate-result
        text: 石像鬼已被制服，喉下的睡眠反射点让它打着嗝昏睡过去，没有死。
        requires: {gate_clear: true}
    exits:
      - to: commission
        label: 退回书房
      - to: gallery
        label: 进入长廊
        requires: {gate_clear: true}
  - id: gallery
    place: 肖像长廊
    opening: 走廊里挂着一排肖像，地板亮得能照见鞋底。一具活铠甲端着银托盘巡逻。
    cast: [bran, lyra, elin]
    beats:
      - id: patrol
        text: 金属脚步由远及近，托盘上的茶杯轻轻作响。
    encounter:
      id: armor
      name: 端托盘的活铠甲
      hp: 1
      armorClass: 9
      attackBonus: -2
      damage: 1
      rewardFlags: {gallery_clear: true}
    information:
      - id: armor-result
        text: 活铠甲已停机，后颈的复位装置解除巡逻模式；里面没有活人。
        requires: {gallery_clear: true}
    exits:
      - to: gate
        label: 退回铁门
      - to: kennel
        label: 前往内院
        requires: {gallery_clear: true}
  - id: kennel
    place: 玫瑰庭院
    opening: 一头地狱犬守着通往餐厅的小门，火星从牙缝冒出。它的项圈上写着“请勿喂食”。
    cast: [bran, lyra, elin]
    beats:
      - id: hound
        text: 花丛被低吼震得簌簌发响，狗的爪子压在湿漉漉的石板上。
    encounter:
      id: hellhound
      name: 正在减肥的地狱犬
      hp: 1
      armorClass: 8
      attackBonus: -2
      damage: 1
      rewardFlags: {kennel_clear: true}
    information:
      - id: hound-result
        text: 地狱犬已被制伏，耳根是它的敏感处；它伏在软垫上昏睡，没有死。
        requires: {kennel_clear: true}
    exits:
      - to: gallery
        label: 退回长廊
      - to: pantry
        label: 前往餐厅
        requires: {kennel_clear: true}
  - id: pantry
    place: 餐厅
    opening: 银杯里盛着猩红饮料。一团巨型黏液怪从餐车下鼓起来。
    cast: [bran, lyra, elin]
    beats:
      - id: banquet
        text: 蜡烛的火光映在杯壁上，餐车边压着一张被浸湿的配货单。
    encounter:
      id: slime
      name: 餐车下的巨型黏液怪
      hp: 1
      armorClass: 8
      attackBonus: -2
      damage: 1
      rewardFlags: {pantry_clear: true}
    checks:
      - id: inspect-drinks
        label: 查看配货单
        dc: 9
        bonus: 0
        successFlags: {juice_clue: true}
        failureFlags: {invoice_stained: true}
    information:
      - id: juice
        text: 配货单写着石榴、甜菜和无酒精饮料。
        requires: {juice_clue: true}
      - id: slime-result
        text: 黏液怪的核心已被压制，身体收缩成一团并进入休眠。
        requires: {pantry_clear: true}
    exits:
      - to: kennel
        label: 退回庭院
      - to: confessional
        label: 前往礼拜间
        requires: {pantry_clear: true}
  - id: confessional
    place: 礼拜间
    opening: 礼拜间很安静，门旁写着“告解自愿，出口在右”。
    cast: [bran, lyra, elin]
    allowRest: true
    beats:
      - id: quiet
        text: 供桌旁摆着一张老式告解椅，一只黄铜喇叭落满灰尘。
      - id: bell
        text: 墙上的小铃轻响了一声。右侧的普通门没有上锁。
    checks:
      - id: open-donation-box
        label: 打开卡住的维修工具箱
        dc: 10
        bonus: -1
        successFlags: {lucky_lock: true}
        failureFlags: {pick_stuck: true}
    exits:
      - to: pantry
        label: 返回餐厅
      - to: vestry
        label: 从普通门去祭衣间
  - id: vestry
    place: 祭衣间
    opening: 一个长角督工站在书架旁，手里握着一把黑铁尺。
    cast: [bran, lyra, elin]
    beats:
      - id: warden
        text: 书架旁散落着几张纸，督工的脚步挡住了通往楼梯的门。
    encounter:
      id: horned-warden
      name: 管理图书的角魔督工
      hp: 1
      armorClass: 9
      attackBonus: -2
      damage: 1
      rewardFlags: {vestry_clear: true}
    information:
      - id: warden-result
        text: 督工已被制服，角根是它的弱点；它坐在书架旁缓气，并未死亡。
        requires: {vestry_clear: true}
    exits:
      - to: confessional
        label: 退回礼拜间
      - to: stairs
        label: 前往楼梯
        requires: {vestry_clear: true}
  - id: stairs
    place: 城堡楼梯
    opening: 楼梯顶端，一名食人魔管家穿着燕尾服，攥着一把巨大的鸡毛掸子。
    cast: [bran, lyra, elin]
    beats:
      - id: butler
        text: 高处传来关门声，管家挡在楼梯上。
    encounter:
      id: ogre-butler
      name: 食人魔管家
      hp: 1
      armorClass: 9
      attackBonus: -2
      damage: 1
      rewardFlags: {stairs_clear: true}
    information:
      - id: butler-result
        text: 管家已失去战斗能力，膝后的护具是可利用的弱点；他倒在地毯上昏睡，没有死。
        requires: {stairs_clear: true}
    exits:
      - to: vestry
        label: 退回祭衣间
      - to: bedchamber
        label: 前往主卧
        requires: {stairs_clear: true}
  - id: bedchamber
    place: 城堡主卧
    opening: 黑纱床幔低垂，一只红杯搁在桌边。高窗挂着厚厚的黑帘，拉绳在一侧。
    cast: [bran, lyra, elin, sevian]
    beats:
      - id: encounter
        text: 屋里有人。门外的动静渐渐平息。
        cue: sevian
      - id: tension
        text: 晨光透过帘边的一条缝落在地毯上。
        cue: sevian
    checks:
      - id: inspect-bedroom
        label: 查看红杯与梳妆台
        dc: 10
        bonus: 0
        successFlags: {bedroom_clue: true}
        failureFlags: {bedroom_unclear: true}
    information:
      - id: bedroom-clue
        text: 红杯里有果肉，遮光帘的采购单上写着白天补眠。
        requires: {bedroom_clue: true}
    exits:
      - to: stairs
        label: 退回楼梯
      - to: sunlight
        label: 等日出，亲自拉开窗帘
      - to: withdrawal
        label: 放弃行动并离开
  - id: sunlight
    place: 晨光中的主卧
    opening: 晨光从拉开的窗帘间涌入，落在地毯和杯沿上。
    cast: [bran, lyra, elin, sevian]
    beats:
      - id: light
        text: 灰尘在光束里缓缓漂浮，房间里一下明亮起来。
        cue: sevian
      - id: reveal
        text: 屋外传来脚步声，越来越近。
        cue: sevian
    checks:
      - id: verify-identity
        label: 核对身份材料
        dc: 5
        bonus: 0
        successFlags: {identity_verified: true}
        failureFlags: {papers_dropped: true}
    information:
      - id: identity-confirmed
        text: 身份材料证实屋主人是一名精灵。
        requires: {identity_verified: true}
    exits:
      - to: settlement
        label: 留下来谈委托与损失
      - to: departure
        label: 离开城堡
  - id: settlement
    place: 主卧里的商谈
    opening: 委托书和维修清单被放在桌上，晨光照亮纸张的边缘。
    cast: [bran, lyra, elin, duke, sevian, adela]
    beats:
      - id: negotiations
        text: 门口的脚步停了下来，书桌周围的空气有些紧绷。
        cue: duke
      - id: voices
        text: 清单的一角卷起来，压住了委托书上的签名。
        cue: adela
    checks:
      - id: negotiate-fee
        label: 据合同争取承认委托已完成
        dc: 10
        bonus: 0
        successFlags: {duke_acknowledges_contract: true}
        failureFlags: {duke_disputes_fee: true}
    exits:
      - to: departure
        label: 结束商谈，离开城堡
  - id: departure
    place: 城堡外的台阶
    opening: 晨光落在城堡台阶上，空气里有潮湿玫瑰的气味。
    cast: [bran, lyra, elin]
    beats:
      - id: farewell
        text: 远处的钟声响起，离开的路就在脚下。
    exits:
      - to: epilogue
        label: 道别，结束这段冒险
  - id: withdrawal
    place: 公爵书房外的走廊
    opening: 走廊里有些凉，雨声隔着墙传来。书房的门就在身后。
    cast: [bran, lyra, elin, duke]
    beats:
      - id: pause
        text: 台阶通向外面的雨幕，你可以留下说话，也可以继续离开。
        cue: duke
      - id: farewell
        text: 门厅里的灯映在潮湿的地砖上。
    exits:
      - to: commission
        label: 回到书房继续交谈
      - to: epilogue
        label: 告别后离开，结束冒险
  - id: epilogue
    place: 尾声
    opening: 雨渐渐小了，这段旅程在此告一段落。
    cast: [bran, lyra, elin]
    ending: true
    exits: []
