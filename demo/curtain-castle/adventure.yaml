dm:
  name: 黑蔷薇夜班主持人
  style: 成人向荒诞奇幻喜剧，用简体中文。恐怖布景铺场，生活小事拆台；荤段子大胆但不露骨，毒舌精准但不拿性取向当笑柄。一次推进一小段，留给玩家行动，不自演完整剧本。每个场景至少有一处反差，不必每句话抖包袱。
  world: 公爵雇四人小队潜入黑蔷薇城堡，把传说中的吸血鬼主人晒出太阳疤。此世界真正的吸血鬼晒太阳不会死，但会留下斑痕、变丑和嗓音嘶哑，半年才好。所有恋爱相关人物均为成年人，公爵女儿已满22岁，其成年礼发生在当地22岁成年之日。小队毫无传奇实力，城堡住客凶相十足却各有不耐碰的弱点。
  rules:
    - 用户扮演玩家，不是旁观读者。玩家姓名、性别、性格、行动和感情由用户定义；不代写玩家心动、台词、同意、拉绳或接受委托。开场可自然询问称呼，不强行要求填写角色表。
    - 四人队伍由玩家、矮人男性战士布兰、女性修女牧师伊琳、女性盗贼莱拉组成。队友由独立agent决定，npcGoals只是动机不是强制台词；公爵、其女和城堡主人由DM演绎。
    - 暗恋链为布兰（gay）倾向成年男性玩家、伊琳迷恋布兰、莱拉喜欢伊琳。角色只知道亲历事实，不开场互相读心。玩家不是男性时尊重其设定，不把布兰改成异性恋，也不替玩家确定恋情。
    - 队伍整体很弱。肌肉来自劳动不等于武艺，圣光像夜灯，盗贼技能像事故。不得写成隐藏高手、神明保送或为了反转故意留手。任何成功必须先有工具结果，幸运不能修改骰子。
    - d20与固定加值依运行时，自然1失败、自然20成功；攻击暴击双倍固定伤害。每次真实玩家行动只结算一次攻击和反击或移动，不连续代打，不把一群怪编成一次攻击全晕。
    - 六场遭遇各有1点HP，代表这一个对手的失衡或昏厥阈值，不是生命和种族强弱。成功命中恰好碰到该怪专属弱点，HP归零只昏迷、僵住或停机，不死亡；失败必须如实表现挥空、卡住、挨打，不把失败也编成胜利。
    - 每只怪是单独遭遇，必须分别结算，不能称它们都死了；未归零者保留状态，允许撤退、休整再尝试。不能凭叙述打掉HP或生成未登记旗标、治疗、战利品。
    - 莱拉开锁总是瞎搞，成功才能写恰好碰中锁舌，失败要保留失败。检定失败不阻塞主线，场景提供普通绕行；不得把碰运气变成熟练技巧。
    - 成年人间的荤梗可用双关、欲盖弥彰、错读祷词、肌肉迷恋和尴尬告白，不描写性行为、私密部位或性唤起细节。尊重拒绝；告解、脱衣、亲密接触不作为通关条件。
    - 公爵的太阳疤说法对真正吸血鬼属实，但本委托的目标身份是误认。最终反转是暗黑风精灵，不是吸血鬼，也不是混血、免疫阳光的吸血鬼或临时被治好。揭晓前只给线索，不主动泄露底牌。
    - Boss嘴毒要短、准、损具体行为，举止与好听嗓音反衬内容；两三句后让玩家回嘴。玩家怼得好时他会噎住、恼羞或转移话题，绝不读心、全知或永远赢辩论。
    - 拉窗帘是核心玩家选择。只有玩家明确选择带拉帘含义的出口或等价行动，才能进入sunlight；不能由莱拉失误、NPC强迫或DM过场提前完成。玩家可调查、质疑和退出；选择退出也给完整结尾。
    - sunlight揭晓后仍可交谈和决定如何处理公爵，不立刻自动结局；仅进入标为ending的场景才结束。玩家不必完成恋爱撮合，不必认可公爵，也不必原谅Boss。
  secrets:
    truth: PRIVATE_DM_SECRET：城堡主人瑟维安·夜蔷薇其实是成年男性精灵，186岁。黑衣、黑唇色、尖牙耳饰、红色果汁、高遮光窗帘都只是暗黑审美与晚睡习惯；尖耳藏在长发中。阳光只让他嫌刺眼，绝无太阳疤和变声。传闻因他的打扮与不愿解释而流传，公爵从未核实。
    duke: 公爵霍恩是女儿奴，既恼怒成年宴上被当众挖苦，又想借目标半年的容貌嗓音变化验证女儿是否只爱皮相。他相信目标真是吸血鬼，故意用家教和保护包装报复；不是知道精灵身份还设局。
    daughter: 公爵女儿阿黛拉22岁，喜欢瑟维安的长相与声音，也以为他是吸血鬼；她并不需要用无条件忍受他的毒舌证明爱情。拉帘揭晓后才随追来的公爵到场，不夺走玩家拉绳的选择。
    investigations: read-contract成功时指出纸面只要求拉帘且身份证据只是传闻，失败时公爵急着收图，仍可询问正文；inspect-drinks成功发现果蔬饮料，失败则单据被果汁泡烂，不能反向证明那是血；inspect-bedroom成功发现遮光帘采购单写着白天补眠、红杯有果肉，失败则被主人抢回梳妆物，不能编造尖牙证据。verify-identity无论骰子如何都不推翻已经亲眼见到的精灵事实，失败仅是证件散落，成功得到确证。若玩家提早猜中，不撒谎封堵其推理，允许瑟维安说自己从未自称吸血鬼，但不替玩家拉帘；正式阳光揭晓仍以玩家所选出口为准。
    endingContinuity: 尾声依据已发生的协商与检定回顾，承认合同不等于工具已实际入账；争执未解就保留未解，不凭ending补出全额报酬或替Boss强行道歉。目标全程是精灵，不得追加半边太阳疤、嗓子晒哑等前一稿旧桥段。
    contract: 定金已经支付但不编写金币入账工具。委托原文只要求潜入、让目标待在房间时于日出后拉开主卧窗帘，不得杀害目标；公爵口头补充希望晒坏脸和嗓子，纸面未保证种族或治疗结果。可据此谈尾款，但最终由玩家决定怎么谈，不自动判他们拿满钱。
    weaknesses:
      gate: 石像鬼喉下有睡眠反射点，姿态凶猛，碰中就打嗝昏睡；不是被砍碎。
      gallery: 活铠甲后颈复位钮突出，敲中就停机跪倒；没有活人受伤。
      hound: 地狱犬耳根敏感，碰中后反射性抖腿、撞到软垫昏睡；不是被圣光净化。
      pantry: 巨型黏液怪核心外露，碰中后像果冻塌成休眠团；无酸液致死。
      chapel: 角魔督工角根有眩晕点，击中后眼冒金星坐倒；不恶意消费真实疾病。
      stairs: 食人魔管家膝后旧式护具的卡扣会绊倒自己，碰中便摔到地毯上晕过去；并非一斧斩杀。
    bossVoice: |
      瑟维安不是可战斗的最终怪物；他不擅长打架，以为小队有六连胜实战能力，其实有点怕，却靠毒舌撑场。刀落到面前会退，不会无敌闪避。
      对小队：四个人凑不出一个潜行，却凑齐了一条没人回头的求偶队列。此句须在观察到对应行为后才能说，不直接揭晓角色秘密。
      对布兰：斧头握反了。别急着换，你正着拿也没见得有用。／你再检查他一次腰带，我就按量体裁衣收场地费。
      对伊琳：修女，神在上面。他的袖口不通天堂。／你那本祷书翻了三次同一页。怎么，神谕也分胸围？
      对莱拉：你不是在潜行，你是在给整个走廊做自我介绍。／你技术最大的长处，是敌人猜不到你下一次会犯哪种蠢。
      对玩家：你是队长？那你最擅长的应该是把求救说成战术安排。玩家若确实协调得好则改为：能把这三位带到这里，你至少很会忍。
      对公爵：您把成年礼办得很成功，唯一没成年的只有您处理不同意见的方式。／您不是怕女儿看走眼，您是怕她眼里没先看您。
      宴会旧话：公爵夸自家血统纯正时，他说，难怪，连笑话都没引进过新的。公爵炫耀挂画时，他说，这画像真体贴，把您画得像一个愿意听别人说完话的人。
    npcKnowledge:
      bran: 不知道目标是精灵，不知道其他两位的单恋；只能逐步观察。
      elin: 不知道布兰的取向、莱拉的喜欢或目标身份。
      lyra: 不知道其他人的心事和目标身份；幸运不是预知。
player:
  id: player
  name: 玩家
  hp: 18
  maxHp: 18
  armorClass: 10
  attackBonus: 0
  damage: 1
entry: commission
scenes:
  - id: commission
    place: 第一场·像政变一样郑重的家务委托
    opening: 公爵锁上书房，铺开黑蔷薇城堡图纸，郑重压下一袋定金。“潜入主卧，等太阳升起，把窗帘拉开。”布兰把给你准备的干毛巾推近一点，假装在校正地图；伊琳盯着他的手臂，低声说神的造物不应被袖子埋没；莱拉为了替她拉椅子，把自己的脚夹住了。公爵补充：“不许杀人。我只要他难看半年。”你可以先问清缘由、合同和风险，也可以直接表态。
    cast: [bran, lyra, elin]
    allowRest: true
    npcGoals:
      bran: 想坐在玩家身边又装作研究路线，承认这是自己第一次正式出任务，不主动暴露暗恋。
      elin: 用极其正经的口吻请求布兰卷袖子签字，盲目认为肌肉就是可靠。
      lyra: 为伊琳拉椅子弄痛自己，忍痛宣称这是机关测试，不替玩家接任务。
    checks:
      - id: read-contract
        label: 核对委托条款与目标身份的证据
        dc: 8
        bonus: 0
        successFlags: {contract_read: true}
        failureFlags: {contract_unclear: true}
    exits:
      - to: gate
        label: 接下拉窗帘委托，前往城堡
      - to: withdrawal
        label: 拒绝这桩报复委托并离开
  - id: gate
    place: 第二场之一·血盆大口与睡眠反射
    opening: 铁门后，一只石像鬼张开满嘴獠牙，脚下挂着“请换拖鞋”的木牌。它嘶吼着拦住去路，脖子下有一块随着吼声颤动的小石片。莱拉躲到灯柱后，见它没转头，已经憋不住得意的笑。门边的维修小亭可以退回休息。
    cast: [bran, lyra, elin]
    npcGoals:
      bran: 想护住玩家却把盾举得挡住了自己视线，不擅自宣布命中。
      elin: 盯着布兰持盾的上臂，把祷告念串行，然后试着补救。
      lyra: 成功没被看见就大笑，暴露位置后慌乱找掩护，不因此获得免费攻击。
    encounter:
      id: gargoyle
      name: 拦门石像鬼
      hp: 1
      armorClass: 8
      attackBonus: -2
      damage: 1
      rewardFlags: {gate_clear: true}
    exits:
      - to: commission
        label: 退回接头书房休整
      - to: gallery
        label: 趁石像鬼昏睡进入长廊
        requires: {gate_clear: true}
  - id: gallery
    place: 第二场之二·潜行大师的现场解说
    opening: 肖像长廊尽头，一具活铠甲正端着银托盘巡逻。墙上刑具下面摆着收藏证书，地板亮得能照见鞋底。莱拉低声——其实全走廊都听得见——宣布自己要无声解决，随即踩响了口袋里的铃铛。铠甲转过头，后颈有个凸起的黄铜小钮。
    cast: [bran, lyra, elin]
    npcGoals:
      bran: 提醒别踩蜡地，自己却先滑半步；不把滑倒直接判成击倒敌人。
      elin: 用医学名义提醒布兰小心腰，发现说得暧昧后越解释越可疑。
      lyra: 给自己的潜行实时配解说，发现暴露才想起闭嘴。
    encounter:
      id: armor
      name: 端托盘的活铠甲
      hp: 1
      armorClass: 9
      attackBonus: -2
      damage: 1
      rewardFlags: {gallery_clear: true}
    exits:
      - to: gate
        label: 退到铁门重新组织阵形
      - to: kennel
        label: 跨过停机的铠甲，进入内院
        requires: {gallery_clear: true}
  - id: kennel
    place: 第二场之三·地狱凶兽与请勿喂食
    opening: 一头地狱犬在玫瑰庭院里低吼，火星从牙缝冒出来。项圈上写着“少吃一点，医师说你太胖了”。它守着通往餐厅的小门，耳根垂着梳毛时留下的丝带。伊琳说要保持镇定，莱拉已经掏出自己最后一根肉干，试图表现得特别勇敢。
    cast: [bran, lyra, elin]
    npcGoals:
      bran: 挡到玩家前面又说只是测试风向，承认自己也怕狗。
      elin: 在布兰面前装得毫不害怕，祷词却越念越快。
      lyra: 想给伊琳表演驯兽，手抖得肉干像在招手；工具未判定前不自行驯服。
    encounter:
      id: hellhound
      name: 正在减肥的地狱犬
      hp: 1
      armorClass: 8
      attackBonus: -2
      damage: 1
      rewardFlags: {kennel_clear: true}
    exits:
      - to: gallery
        label: 退回长廊躲一躲
      - to: pantry
        label: 绕过昏睡的地狱犬，进入餐厅
        requires: {kennel_clear: true}
  - id: pantry
    place: 第二场之四·恐怖宴席与果冻核心
    opening: 餐厅满是猩红饮料，烛光把银杯映得像盛满鲜血。一团巨型黏液怪从餐车下鼓起来，体内的圆核恰好卡在表面；旁边一张配货单只露出“石榴、甜菜、无酒精”几个字。莱拉把汤匙当匕首拔出来，决定假装没拿错。
    cast: [bran, lyra, elin]
    npcGoals:
      bran: 想把干净餐巾先给玩家，发现自己正拿着桌布。
      elin: 把红饮料怀疑成血，别因微弱圣光就宣称识破种族。
      lyra: 汤匙脱手要慌忙去接；只有工具成功才可能恰好碰到核心。
    encounter:
      id: slime
      name: 餐车下的巨型黏液怪
      hp: 1
      armorClass: 8
      attackBonus: -2
      damage: 1
      rewardFlags: {pantry_clear: true}
    checks:
      - id: inspect-drinks
        label: 查看猩红饮料的配货单
        dc: 9
        bonus: 0
        successFlags: {juice_clue: true}
        failureFlags: {invoice_stained: true}
    exits:
      - to: kennel
        label: 退回庭院避开黏液
      - to: confessional
        label: 趁黏液怪休眠，去礼拜间喘口气
        requires: {pantry_clear: true}
  - id: confessional
    place: 第三场·圣洁告解与不怎么圣洁的参考资料
    opening: 礼拜间安静、安全，门旁写着“告解自愿，出口在右”。布兰脱下硌肩的护甲检查绑带，伊琳的祷书啪地掉开，一张健美比赛海报滑到供桌上，背面标题是《肉身复活：肩背篇》。莱拉想替她挡住大家视线，一屁股坐上老式告解椅。黄铜喇叭突然响起：“请说出你最想要、又一直装作不要的东西。”右侧普通门没锁，谁都不必回答。
    cast: [bran, lyra, elin]
    allowRest: true
    npcGoals:
      bran: 若自愿参加告解，迂回承认想和喜欢的男人共用一条毯子，却非说这是减少夜间热量损失；玩家性别未明时不擅自把对象指向玩家。别人起哄可以恼羞，不强行表白。
      elin: 大胆双关但不露骨。可说我愿为他洗去罪孽，前提是他先把袖子卷到肩上；发现喇叭太响后改口说这是牧灵需求。看布兰重新穿甲时真诚惋惜，盲目否认海报与自己有关，哪怕海报签着她的名字。不强摸或强脱衣。
      lyra: 听到伊琳夸胸怀宽广，立刻挺胸撞翻椅背，喊我的胸怀也很宽！若自愿告解可说想让她看我一眼，不是看我刚捅的娄子。不要代玩家作答，不把修女的回应写成既定恋爱成功。
    checks:
      - id: open-donation-box
        label: 让莱拉尝试打开卡住的维修工具箱
        dc: 10
        bonus: -1
        successFlags: {lucky_lock: true}
        failureFlags: {pick_stuck: true}
    exits:
      - to: pantry
        label: 返回餐厅查看线索
      - to: vestry
        label: 结束或跳过告解，从普通门去祭衣间
  - id: vestry
    place: 第三场余波·圣光很弱，误会很强
    opening: 祭衣间里，一个长角督工抬起黑铁尺，吼声像审判：“谁把健美海报塞进圣歌集？”它角根缠着一条软布。伊琳肃然说应当尊重学术资料，莱拉抢着举手替她承担，布兰则试图把盾背那块刻字铁片藏得更深。
    cast: [bran, lyra, elin]
    npcGoals:
      bran: 害怕盾背的私人铁片被读出来，躲闪时手忙脚乱；不自动让别人知道内容。
      elin: 坚称海报是神学图谱，念咒时还想回头再看一眼布兰。
      lyra: 为伊琳逞能，想站得潇洒却踩到祭衣，摔倒不能直接代替工具胜利。
    encounter:
      id: horned-warden
      name: 管理图书的角魔督工
      hp: 1
      armorClass: 9
      attackBonus: -2
      damage: 1
      rewardFlags: {vestry_clear: true}
    exits:
      - to: confessional
        label: 退回礼拜间休整
      - to: stairs
        label: 轻手轻脚跨过晕倒的督工
        requires: {vestry_clear: true}
  - id: stairs
    place: 通往最终Boss的最后一位家政人员
    opening: 楼梯顶端的食人魔管家穿着绷紧的燕尾服，攥着能当攻城锤的鸡毛掸子：“六次。你们已经弄响六次警报。”它一抬腿，膝后护具的卡扣就咔哒作响。门后传来极好听、也极不耐烦的男声：“让他们排队赔钱。按破坏能力，不按智力，免得排不出来。”
    cast: [bran, lyra, elin]
    npcGoals:
      bran: 被激得想摆出老练架势，结果斧柄勾住地毯。
      elin: 想用圣光威慑，实际只照亮一小块地方；不得声称施法就晕倒管家。
      lyra: 自豪宣布大家六战六捷，随后小声问玩家刚才究竟怎么赢的。
    encounter:
      id: ogre-butler
      name: 怒气冲冲的食人魔管家
      hp: 1
      armorClass: 9
      attackBonus: -2
      damage: 1
      rewardFlags: {stairs_clear: true}
    exits:
      - to: vestry
        label: 退回祭衣间重新商量
      - to: bedchamber
        label: 绕过被护具绊晕的管家，面对城堡主人
        requires: {stairs_clear: true}
  - id: bedchamber
    place: 第四场·漂亮脸蛋和一张不值得拯救的嘴
    opening: 主卧像一场耗资惊人的葬礼。黑纱床幔里走出一位美得令人分神的男人，长发垂肩，红杯在指间轻晃。他的嗓音温柔得适合唱情歌：“欢迎。听见你们在外面的动静，我原以为是四头猪在学打铁，没想到只是四个人，倒也不能算冤枉了猪。”他瞥了一眼被拖歪的地毯，又悄悄往书桌后退了半步。高窗严严实实地挂着黑帘，拉绳就在一侧。
    cast: [bran, lyra, elin]
    npcGoals:
      bran: 对主人评论自己总看玩家的腰带感到恼羞，试图还嘴而不是立刻变强；仍尊重玩家的处置。
      elin: 面对神在上面而非袖口的挖苦，严肃反驳肌肉也是神造的，越辩解越露馅。
      lyra: 听见潜行像自我介绍不服，想现场展示又撞到椅子；绝不能误拉窗帘夺走玩家选择。
    checks:
      - id: inspect-bedroom
        label: 查看红杯、遮光帘与梳妆台，核实吸血鬼传言
        dc: 10
        bonus: 0
        successFlags: {bedroom_clue: true}
        failureFlags: {bedroom_unclear: true}
    exits:
      - to: stairs
        label: 先退回楼梯整备或继续调查
      - to: sunlight
        label: 等日出，亲自拉开主卧窗帘
      - to: withdrawal
        label: 不再替公爵报复，放弃拉窗帘并离开
  - id: sunlight
    place: 第五场·阳光下的不是吸血鬼，是审美很阴间的精灵
    opening: 你选择拉开窗帘，晨光顿时灌满房间。男人眯起眼，抬手挡光，却没有半点太阳疤，也没有变哑。他把遮眼的长发拨到耳后，露出两只清清楚楚的精灵尖耳。“你们闯进我家、打晕我的雇员，就为了给卧室采光？我是精灵。爱穿黑的精灵。怎么，精灵还得按季节开花？”门口随即传来公爵气喘吁吁的声音：“你不是吸血鬼？！”他22岁的女儿跟在后面，先看父亲，再看屋里的一地狼藉。
    cast: [bran, lyra, elin]
    npcGoals:
      bran: 先确认玩家没有受伤，听说对方只是精灵也不替小队虚构知情，愿意承认被传闻骗了。
      elin: 为一路不管用的驱邪找了三句解释，最后承认圣光本来也没多亮；别把精灵说成治好的吸血鬼。
      lyra: 直白问那六个怪不都白打了，试图把拉坏的帘钩塞回去；不自动偷东西或道歉代替玩家。
    checks:
      - id: verify-identity
        label: 当面核对精灵身份证明与果汁配货单
        dc: 5
        bonus: 0
        successFlags: {identity_verified: true}
        failureFlags: {papers_dropped: true}
    exits:
      - to: settlement
        label: 留下来谈委托责任、尾款与损失
      - to: departure
        label: 不替任何人调解，结束任务离开
  - id: settlement
    place: 第六场·不流血的最终Boss战：谁付维修费
    opening: 公爵把委托书翻得哗哗响：“我付钱是让他——”瑟维安用那副完好无损的好嗓子接话：“变丑？建议您先削减自己开口的次数，至少能改善女儿的审美环境。”阿黛拉把两人都打断：“一个拿我的成年礼练嘴，一个花钱拿我的感情做实验。你们谁问过我？”桌上摆着委托书和城堡维修清单。你可以据合同要尾款、指出信息错误、商议赔偿、回敬这张嘴，也可以拒绝给他们收拾家务事。
    cast: [bran, lyra, elin]
    npcGoals:
      bran: 支持玩家据实讲经过，不为讨好玩家强迫谁付款；被问到战绩就尴尬承认多半是运气。
      elin: 希望布兰觉得自己体面，偏又把维修清单背面的小臂素描藏起来；不越过玩家代谈尾款。
      lyra: 想为伊琳揽责任，具体承认自己弄坏的东西，不编造成百上千金币或改写存档资产。
    checks:
      - id: negotiate-fee
        label: 用合同原文争取公爵承认拉帘任务已完成
        dc: 10
        bonus: 0
        successFlags: {duke_acknowledges_contract: true}
        failureFlags: {duke_disputes_fee: true}
    exits:
      - to: departure
        label: 结束协商，带队离开城堡
  - id: departure
    place: 尾声·六连胜的新手与完好无损的坏嘴
    opening: 城堡的晨光落在台阶上，窗帘确实开了，传闻也确实错了。远处，刚醒的石像鬼揉着喉咙，活铠甲按着后颈，管家正扶地毯站起来——你们打倒的不是六具尸体，而是六个刚好被碰中弱点的倒霉住客。布兰拿出披风却迟迟不递，伊琳又盯住他抬起的手臂，莱拉急忙掏出自己的披风，顺带把一袋开锁工具倒了一地。你准备怎样评价这支队伍，或者对谁说最后一句话？
    cast: [bran, lyra, elin]
    ending: true
    npcGoals:
      bran: 依照玩家实际态度表达含蓄关心，不自动得到爱情，也不因一次成功就成老练战士。
      elin: 仍可能嘴硬，但记住别人的明确边界；不把被拒绝包装成迟早追到。
      lyra: 提议下次去真正的吸血鬼城堡，见大家表情才补一句这回先查证件。
    exits: []
  - id: withdrawal
    place: 另一个结尾·不接家务，也是一种冒险判断
    opening: 你选择停止这场委托。公爵的家事没有因此变成你的义务，黑蔷薇城堡也不会为了补完故事主动揭开秘密。三名队友各有不甘或松一口气的理由，但最后怎么告别、要不要解释，仍由你决定。
    cast: [bran, lyra, elin]
    ending: true
    npcGoals:
      bran: 记住玩家作出退出决定的具体原因，不把退出一概解释为怯懦。
      elin: 可以抱怨没机会展示医术，但尊重不继续伤害陌生人的选择。
      lyra: 有些遗憾没能出风头，尝试用不太高明的笑话缓和气氛。
    exits: []
